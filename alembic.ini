# alembic.ini
#
# alembic.ini is Alembic's config file, committed to the repo.
# The ONE thing you must NOT put here is the actual database URL —
# that lives in .env and is injected at runtime in env.py below.
# If you hardcode the URL here, it ends up in git history forever.

[alembic]
# Path to migration scripts, relative to where you run alembic from.
# Always run alembic from the project root: `alembic upgrade head`
script_location = alembic

# Template for new migration filenames.
# %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d - human-readable timestamp
# %%(rev)s  - short revision hash  
# %%(slug)s - slugified message from -m "..."
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for timestamps in filenames
timezone = UTC

# How many characters of the revision hash to use in filenames
truncate_slug_length = 40

[post_write_hooks]
# Optional: auto-format generated migration files with ruff
# hooks = ruff
# ruff.type = exec
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S